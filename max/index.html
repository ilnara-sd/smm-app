<style>
:root{--bg:#141414;--card:#1E1E1E;--line:#333;--or:#F26A1B;--cream:#F3EDE4;--tx:#fff;--mut:#A8A29A}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 "Montserrat",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;padding:0 0 env(safe-area-inset-bottom)}
.w{max-width:560px;margin:0 auto;padding:28px 18px 36px}
a{color:inherit;text-decoration:none}
.who{font-size:13px;letter-spacing:.18em;color:var(--mut);text-transform:uppercase}
.who:after{content:"";display:block;width:44px;height:2px;background:var(--or);margin:10px 0 18px}
h1{font-size:34px;line-height:1.08;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
h1 b{color:var(--or)}
.sub{color:var(--mut);margin-top:12px;max-width:42ch}
.hero{background:var(--or);color:#fff;border-radius:22px;padding:22px 20px;margin:26px 0 30px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-30px;top:-20px;width:90px;height:240px;background:rgba(0,0,0,.14);transform:skew(-22deg)}
.hero h2{font-size:22px;line-height:1.15;font-weight:800;position:relative}
.hero p{margin:8px 0 16px;font-size:15px;position:relative;max-width:36ch}
.btn{display:block;text-align:center;font-weight:700;font-size:15px;padding:14px;border-radius:14px;background:#141414;color:#fff;position:relative}
.s h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600;margin:0 0 12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
.c.l{background:var(--cream);color:#141414;border-color:var(--cream)}
.c.l .d,.c.l li{color:#3b3731}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.c h4{font-size:18px;line-height:1.2;font-weight:800}
.p{white-space:nowrap;font-weight:800;font-size:14px;color:var(--or);border:1.5px solid var(--or);border-radius:999px;padding:3px 10px}
.d{color:var(--mut);margin:8px 0 10px;font-size:15px}
.c ul{list-style:none;padding:0;margin:0 0 12px}
.c li{position:relative;padding-left:16px;font-size:14px;color:#CFCAC2;margin:3px 0}
.c li:before{content:"";position:absolute;left:0;top:.6em;width:7px;height:2px;background:var(--or)}
.f{font-size:13px;color:var(--mut);margin-bottom:14px}
.f b{color:var(--tx);font-weight:600}.c.l .f b{color:#141414}
.go{display:block;text-align:center;font-weight:700;font-size:15px;padding:12px;border-radius:12px;background:var(--or);color:#fff}
.go:active,.btn:active{opacity:.8}
a:focus-visible{outline:2px solid #fff;outline-offset:2px}
footer{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);color:var(--mut);font-size:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer a{color:var(--or);font-weight:600}
</style></head><body><div class="w" id="app"></div>
<script>
// меняете только этот блок: тексты, цены и ссылки

 services:[

  {t:'Стратегия продвижения',p:'6 000 ₽',d:'Понятный план продвижения с учётом ваших целей, продукта и аудитории.',l:['Анализ ситуации и целей','Целевая аудитория и продукт','Позиционирование','Темы контента и путь клиента к покупке'],f:'Подойдёт экспертам и предпринимателям, которым нужно понять, что делать дальше.',g:'Документ с позиционированием и пошаговым планом.',b:'Заказать стратегию',m:'Стратегия'},

 ]
};
(function(){
var D=window.KK_DATA,$=document.getElementById('app');
function e(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var wa=window.WebApp;
var IN=!!(wa&&(wa.initData||wa.platform||wa.version||(wa.initDataUnsafe&&wa.initDataUnsafe.user)));
if(IN){try{wa.ready()}catch(x){}}

function link(m){return D.contact+(D.prefill&&m?'?text='+encodeURIComponent(m):'')}
function A(cls,m,txt){var u=link(m);return '<a class="'+cls+'" href="'+e(u)+'" data-url="'+e(u)+'" target="'+(IN?'_self':'_blank')+'" rel="noopener">'+e(txt)+'</a>'}
var h='<div class="who">'+e(D.who)+'</div><h1>'+D.title+'</h1><p class="sub">'+e(D.sub)+'</p>';
h+='<section class="hero"><h2>'+e(D.hero.t)+'</h2><p>'+e(D.hero.x)+'</p>'+A('btn',D.hero.m,D.hero.b)+'</section><div class="s"><h3>Услуги</h3>';
D.services.forEach(function(s){
 h+='<article class="c"><div class="top"><h4>'+e(s.t)+'</h4><span class="p">'+e(s.p)+'</span></div><p class="d">'+e(s.d)+'</p><ul>'+s.l.map(function(i){return'<li>'+e(i)+'</li>'}).join('')+'</ul><p class="f">'+e(s.f)+'</p>'+(s.g?'<p class="f"><b>В подарок:</b> '+e(s.g)+'</p>':'')+A('go',s.m,s.b)+'</article>';
});
h+='</div><footer><span>Ильнара Садыкова</span><a href="'+e(D.vk)+'" data-url="'+e(D.vk)+'" target="'+(IN?'_self':'_blank')+'" rel="noopener">Группа ВКонтакте</a></footer>';
$.innerHTML=h;
$.addEventListener('click',function(ev){var a=ev.target.closest('a[data-url]');if(!a||!IN)return;ev.preventDefault();go(a.getAttribute('data-url'))});
})();
</script></body></html>
